<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Suzero Nodes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Theme Toggle and Sidebar (same as dashboard.html) -->
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="mobile-header">
            <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
            <h2 class="page-title">Settings</h2>
        </div>

        <section id="settings-section" class="content-section active">
            <div class="profile-settings glass">
                <h3><i class="fas fa-user"></i> Profile Settings</h3>
                <div class="profile-pic-upload">
                    <img src="https://i.imgur.com/JRqk1W1.png" alt="Profile" class="profile-pic-preview" id="profile-pic-preview">
                    <label class="btn btn-secondary">
                        <i class="fas fa-camera"></i> Change Photo
                        <input type="file" id="profile-pic-upload" accept="image/*" style="display: none;">
                    </label>
                </div>
                <input type="hidden" id="profile-pic">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter new username">
                </div>
                <div class="form-group">
                    <label for="github-username">GitHub Username</label>
                    <input type="text" id="github-username" placeholder="Your GitHub username">
                </div>
                <div class="form-group">
                    <label for="whatsapp-number">WhatsApp Number</label>
                    <input type="text" id="whatsapp-number" placeholder="+263719646303">
                </div>
                <button id="save-profile-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Save Profile
                </button>
            </div>

            <div class="password-settings glass">
                <h3><i class="fas fa-key"></i> Change Password</h3>
                <div class="form-group password-toggle">
                    <label for="current-password">Current Password</label>
                    <input type="password" id="current-password" placeholder="Enter current password">
                    <i class="fas fa-eye toggle-eye"></i>
                </div>
                <div class="form-group password-toggle">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password">
                    <i class="fas fa-eye toggle-eye"></i>
                </div>
                <div class="form-group password-toggle">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm new password">
                    <i class="fas fa-eye toggle-eye"></i>
                </div>
                <button id="change-password-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-key"></i> Change Password
                </button>
            </div>
        </section>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
