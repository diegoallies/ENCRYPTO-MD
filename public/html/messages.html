<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Suzero Nodes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Theme Toggle and Sidebar (same as dashboard.html) -->
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="mobile-header">
            <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
            <h2 class="page-title">Messages</h2>
        </div>

        <section id="messages-section" class="content-section active">
            <div class="messages-container glass">
                <div class="messages-sidebar">
                    <div class="messages-header">
                        <h3><i class="fas fa-inbox"></i> Conversations</h3>
                        <button id="new-message-btn" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus"></i> New
                        </button>
                    </div>
                    <div class="conversations-list" id="conversations-list">
                        <div class="empty-state">
                            <i class="fas fa-comments"></i>
                            <p>No conversations yet</p>
                        </div>
                    </div>
                </div>
                <div class="messages-content">
                    <div class="conversation-header" id="conversation-header">
                        <div class="empty-state">
                            <i class="fas fa-comment-alt"></i>
                            <p>Select a conversation</p>
                        </div>
                    </div>
                    <div class="messages-list" id="messages-list">
                        <div class="empty-state">
                            <i class="fas fa-comment-alt"></i>
                            <p>No messages selected</p>
                        </div>
                    </div>
                    <div class="message-composer" id="message-composer" style="display: none;">
                        <textarea id="message-input" placeholder="Type your message..."></textarea>
                        <button id="send-message-btn" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- New Message Modal -->
    <div class="modal-overlay" id="new-message-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>New Message</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="recipient-select">Recipient</label>
                    <select id="recipient-select">
                        <option value="">Select a user</option>
                        <!-- Users will be populated here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-message-content">Message</label>
                    <textarea id="new-message-content" placeholder="Type your message..."></textarea>
                </div>
                <button id="send-new-message-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/messages.js"></script>
</body>
</html>
